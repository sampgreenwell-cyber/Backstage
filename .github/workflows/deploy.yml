name: Build and Deploy Backstage

# Builds the backend Docker image, pushes it to GHCR tagged with the short
# git SHA, and (on push to main) points the running Container App at that
# exact image via `az containerapp update --image`. Also runs
# `terraform plan` for visibility on every push/PR.
#
# Deliberately does NOT run terraform apply. The module uses local state (a
# .tfstate file on the operator's machine, gitignored) rather than a shared
# remote backend, so an ephemeral GitHub Actions runner has no way to know
# what infrastructure already exists - an apply from CI would either fail
# (resources already exist) or drift against real state. That's why day-2
# image deploys go through `az containerapp update` above instead of
# Terraform: it needs no state at all, just talks to the live resource -
# see the `deploy` job below. Infra-only changes (CPU/memory, ingress,
# scaling, etc.) still go through a manual `terraform apply`:
#
#   cd infra/terraform/azure-container-apps
#   terraform apply
#
# (`template[0].container[0].image` is in that resource's ignore_changes
# for exactly this reason - so a manual infra apply doesn't undo whatever
# image this workflow most recently deployed.)
#
# DATABASE_URL and other runtime secrets are NOT set here either - they're
# managed by hand in the Azure Portal (see
# infra/terraform/azure-container-apps/README.md) and are protected from
# being reverted by the Terraform module's lifecycle.ignore_changes block.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TF_WORKING_DIR: infra/terraform/azure-container-apps
  # Must match infra/terraform/azure-container-apps' resource_group_name /
  # app_name variable defaults - this workflow updates the same Container
  # App Terraform provisions, without going through Terraform.
  AZURE_RESOURCE_GROUP: rg-backstage
  CONTAINER_APP_NAME: backstage

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      sha_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Must match the FROM image in packages/backend/Dockerfile - a
          # mismatched host Node version breaks native modules at runtime.
          node-version: '24'

      - name: Enable Corepack (pins the yarn version from package.json)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check
        run: yarn tsc

      - name: Build backend bundle
        run: yarn build:backend

      - name: Compute image name
        id: image
        run: |
          owner="${{ github.repository_owner }}"
          echo "name=${REGISTRY}/${owner,,}/backstage" >> "$GITHUB_OUTPUT"

      # Uses the same GHCR PAT the Terraform module pulls with, not
      # GITHUB_TOKEN: this package was first created by a manual push under
      # that PAT (outside any repo/workflow), so GHCR never linked it to
      # this repo's Actions permissions - GITHUB_TOKEN gets `denied:
      # permission_denied: read_package` no matter what `packages:` scope
      # is granted above. (A package a workflow creates itself would not
      # have this problem.)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform plan (review only - apply is manual, see note at top of file)
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
      TF_VAR_container_image: ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # Because state is local (see note at top of file), this runner starts
      # with an empty state every time - the plan below will always show
      # "will create" for all resources, not a real diff against what's
      # deployed. It's here for early syntax/logic feedback on PRs, not as
      # an accurate change preview.
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false

      # No apply step - see note at the top of this file: local state means
      # applying from CI isn't safe until this module has a remote backend.

  deploy:
    name: Deploy image to Azure Container Apps
    needs: build-and-push
    # Only main pushes actually update the running app - PR/dispatch runs
    # stop at build-and-push (image still gets pushed, tagged with that
    # commit's short SHA, so it's available to deploy manually if needed).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Install containerapp CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # Pinning to the exact tag just pushed (not :latest) is what actually
      # fixes the "pushed but Azure didn't pick it up" problem: Container
      # Apps only creates a new revision when the image *reference* string
      # changes, and :latest never changes even though its content does.
      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.sha_tag }}" \
            --only-show-errors
